<!doctype html>
<html lang="es" data-theme="clinic-teal" data-density="comfortable">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>BaseClínica</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				var raw = localStorage.getItem("baseclinica.appearance.v1");
				if (raw) {
					var p = JSON.parse(raw);
					if (p.themeId) document.documentElement.setAttribute("data-theme", p.themeId);
					if (p.density) document.documentElement.setAttribute("data-density", p.density);
				}
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
